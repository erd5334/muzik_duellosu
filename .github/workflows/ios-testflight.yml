# iOS -> TestFlight otomatik derleme ve yükleme
#
# Gerekli GitHub Secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID                 : 10 karakterlik Team ID (developer.apple.com > Membership)
#   APP_STORE_CONNECT_KEY_ID      : API anahtarının Key ID değeri
#   APP_STORE_CONNECT_ISSUER_ID   : API anahtarları sayfasındaki Issuer ID
#   APP_STORE_CONNECT_KEY_P8      : İndirilen AuthKey_XXXX.p8 dosyasının TÜM içeriği
#
# Çalıştırma: GitHub > Actions > "iOS TestFlight" > Run workflow

name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: En güncel Xcode'u seç
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sürüm bilgisi
        run: |
          xcodebuild -version
          flutter --version
          pod --version

      - name: API anahtarını yerleştir
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p "$RUNNER_TEMP/keys"
          printf "%s\n" "${{ secrets.APP_STORE_CONNECT_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_${{ env.ASC_KEY_ID }}.p8"
          cp "$RUNNER_TEMP/keys/AuthKey_${{ env.ASC_KEY_ID }}.p8" ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${{ env.ASC_KEY_ID }}.p8" >> "$GITHUB_ENV"

      - name: Paketleri indir
        run: flutter pub get

      - name: iOS projesini hazırla (Flutter + CocoaPods)
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }}
          cd ios && pod install --repo-update

      - name: Arşivle (otomatik imzalama)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: App Store Connect'e yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Anahtarı temizle
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
